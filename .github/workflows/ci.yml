name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # This is a Flutter FFI plugin, so it declares a Flutter SDK constraint
      # (required to publish flutter.plugin.platforms). Use the Flutter SDK,
      # which bundles the Dart CLI the rest of the steps call.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lcov clang llvm libssl-dev libuv1-dev libbrotli-dev
      - if: runner.os == 'macOS'
        run: brew install lcov openssl@3 libuv brotli
      - run: flutter pub get
      - run: dart analyze
      - run: dart format --output=none --set-exit-if-changed lib test benchmark tool
      - run: cmake -S src -B build/lib -DCMAKE_BUILD_TYPE=Release -DNITRO_SERVER_BUILD_TESTS=ON
      - run: cmake --build build/lib --parallel
      - run: ./build/lib/nitro_server_tests/nitro_server_engine_tests
      - run: bash tool/coverage.sh
      - run: bash tool/cpp_coverage.sh 90
      - run: mkdir -p build/benchmark && dart compile exe benchmark/compare.dart -o build/benchmark/compare
      - run: ./build/benchmark/compare --quick --keep-alive --raw --only /hello

  sanitize:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        sanitizer: [thread, address]
    runs-on: ${{ matrix.os }}
    # Job-level so the build step's gtest test-discovery run (which executes the
    # instrumented binary) sees them too. detect_container_overflow=0 silences a
    # GoogleTest static-init false positive: ASan container annotations mismatch
    # against the platform's non-instrumented libc++.
    env:
      TSAN_OPTIONS: halt_on_error=1
      ASAN_OPTIONS: detect_leaks=0:detect_container_overflow=0
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libuv1-dev libbrotli-dev
      - if: runner.os == 'macOS'
        run: brew install openssl@3 libuv brotli
      - run: >
          cmake -S src -B build/san -DCMAKE_BUILD_TYPE=Debug
          -DNITRO_SERVER_BUILD_TESTS=ON -DNITRO_SERVER_SANITIZE=${{ matrix.sanitizer }}
      - run: cmake --build build/san --parallel --target nitro_server_engine_tests
      - run: ./build/san/nitro_server_tests/nitro_server_engine_tests

  # HTTP/2 (nghttp2, opt-in): the Http2Session serve path + the reactor wiring
  # (preface/ALPN detection, feedH2 on the loop thread, the Dart-thread respond()
  # hop through onAsync). Runs the engine suite — the self-contained nghttp2
  # client<->server round-trips AND the reactor-level h2c integration test —
  # plain + under ASan + under TSan, on both Unix OSes. Default builds leave
  # NITRO_SERVER_HTTP2 off, so this is the only job exercising the h2 code and
  # where cross-OS / thread-safety h2 regressions surface. The sanitizer env is
  # job-level so the build-time gtest_discover_tests run sees it too.
  http2:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        sanitizer: ['', address, thread]
    runs-on: ${{ matrix.os }}
    env:
      TSAN_OPTIONS: halt_on_error=1
      ASAN_OPTIONS: detect_leaks=0:detect_container_overflow=0
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libuv1-dev libbrotli-dev libnghttp2-dev
      - if: runner.os == 'macOS'
        run: brew install pkg-config openssl@3 libuv brotli nghttp2
      - run: >
          cmake -S src -B build/h2 -DCMAKE_BUILD_TYPE=Debug
          -DNITRO_SERVER_BUILD_TESTS=ON -DNITRO_SERVER_HTTP2=ON
          -DNITRO_SERVER_SANITIZE=${{ matrix.sanitizer }}
      - run: cmake --build build/h2 --parallel --target nitro_server_engine_tests
      - run: ./build/h2/nitro_server_tests/nitro_server_engine_tests

  # Cross-framework comparison (nitro vs dart:io vs shelf vs Go vs Node) across
  # every route and aspect — sequential + under-load p50/p99 latency and
  # throughput. All sides run on the SAME runner through the same driver, so the
  # absolute numbers depend on the runner but the RELATIVE standings are fair and
  # reproducible by anyone: the full table is published to the run's job summary
  # and the raw JSON is uploaded as an artifact. Not a pass/fail gate on the
  # numbers — it fails only if a server crashes or a client can't complete a
  # request.
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Comparison numbers, not a correctness gate. Non-blocking with a timeout so
    # a slow runner never hangs the pipeline or gates merges on throughput.
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev libuv1-dev libbrotli-dev
      - if: runner.os == 'macOS'
        run: brew install openssl@3 libuv brotli
      - run: flutter pub get
      - run: cmake -S src -B build/lib -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/lib --parallel
      - run: mkdir -p build/benchmark && dart compile exe benchmark/compare.dart -o build/benchmark/compare
      # Keep-alive: the headline, hardware-neutral comparison (throughput + tail
      # latency, every route, every framework). Captured to a table + JSON.
      - name: Cross-framework comparison (keep-alive)
        run: |
          ./build/benchmark/compare --keep-alive \
            --json build/benchmark/results-${{ matrix.os }}.json \
            | tee build/benchmark/table-${{ matrix.os }}.md
      # Render the comparison onto the run's Summary page so anyone can read it
      # without digging through logs.
      - name: Publish comparison to the job summary
        if: always()
        run: |
          {
            echo "## Benchmark — ${{ matrix.os }}"
            echo ""
            echo "All frameworks ran on the **same** CI runner through the same driver."
            echo "Absolute numbers depend on the runner; the **relative** standings are the"
            echo "comparable, reproducible result. Reproduce locally with:"
            echo ""
            echo '```sh'
            echo "cmake -S src -B build/lib -DCMAKE_BUILD_TYPE=Release && cmake --build build/lib"
            echo "dart run benchmark/compare.dart --keep-alive"
            echo '```'
            echo ""
            cat build/benchmark/table-${{ matrix.os }}.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.os }}
          path: |
            build/benchmark/results-${{ matrix.os }}.json
            build/benchmark/table-${{ matrix.os }}.md
          if-no-files-found: warn

  # Windows uses a single libuv listener (no SO_REUSEPORT). This job proves the
  # engine compiles and links on Windows/MSVC; the gtest suite is a POSIX-socket
  # harness and does not run here.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libuv + OpenSSL + Brotli (vcpkg)
        run: vcpkg install libuv openssl brotli --triplet x64-windows
      - name: Configure
        run: >
          cmake -S src -B build/lib -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: Build
        run: cmake --build build/lib --config Release
