name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # This is a Flutter FFI plugin, so it declares a Flutter SDK constraint
      # (required to publish flutter.plugin.platforms). Use the Flutter SDK,
      # which bundles the Dart CLI the rest of the steps call.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lcov clang llvm libssl-dev libuv1-dev
      - if: runner.os == 'macOS'
        run: brew install lcov openssl@3 libuv
      - run: flutter pub get
      - run: dart analyze
      - run: dart format --output=none --set-exit-if-changed lib test benchmark tool
      - run: cmake -S src -B build/lib -DCMAKE_BUILD_TYPE=Release -DNITRO_SERVER_BUILD_TESTS=ON
      - run: cmake --build build/lib --parallel
      - run: ./build/lib/nitro_server_tests/nitro_server_engine_tests
      - run: bash tool/coverage.sh
      - run: bash tool/cpp_coverage.sh 90
      - run: mkdir -p build/benchmark && dart compile exe benchmark/compare.dart -o build/benchmark/compare
      - run: ./build/benchmark/compare --quick --keep-alive --raw --only /hello

  sanitize:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        sanitizer: [thread, address]
    runs-on: ${{ matrix.os }}
    # Job-level so the build step's gtest test-discovery run (which executes the
    # instrumented binary) sees them too. detect_container_overflow=0 silences a
    # GoogleTest static-init false positive: ASan container annotations mismatch
    # against the platform's non-instrumented libc++.
    env:
      TSAN_OPTIONS: halt_on_error=1
      ASAN_OPTIONS: detect_leaks=0:detect_container_overflow=0
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libuv1-dev
      - if: runner.os == 'macOS'
        run: brew install openssl@3 libuv
      - run: >
          cmake -S src -B build/san -DCMAKE_BUILD_TYPE=Debug
          -DNITRO_SERVER_BUILD_TESTS=ON -DNITRO_SERVER_SANITIZE=${{ matrix.sanitizer }}
      - run: cmake --build build/san --parallel --target nitro_server_engine_tests
      - run: ./build/san/nitro_server_tests/nitro_server_engine_tests

  # Runs the cross-framework comparison (nitro vs dart:io vs shelf vs Go) and
  # prints the table to the job log. Not a pass/fail gate on the numbers — it
  # fails only if a server crashes or a client can't complete a request.
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev libuv1-dev
      - if: runner.os == 'macOS'
        run: brew install openssl@3 libuv
      - run: flutter pub get
      - run: cmake -S src -B build/lib -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/lib --parallel
      - run: mkdir -p build/benchmark && dart compile exe benchmark/compare.dart -o build/benchmark/compare
      - run: ./build/benchmark/compare --quick --keep-alive

  # Windows uses a single libuv listener (no SO_REUSEPORT). This job proves the
  # engine compiles and links on Windows/MSVC; the gtest suite is a POSIX-socket
  # harness and does not run here.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libuv + OpenSSL (vcpkg)
        run: vcpkg install libuv openssl --triplet x64-windows
      - name: Configure
        run: >
          cmake -S src -B build/lib -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: Build
        run: cmake --build build/lib --config Release
