# Builds the self-contained engine prebuilts and attaches them to the GitHub
# Release for a `v*` tag. Each is built with ALL features
# (`-DNITRO_SERVER_HTTP2=ON` + TLS + brotli) and `-DNITRO_SERVER_STATIC_DEPS=ON`
# so libuv/OpenSSL/brotli/nghttp2 are statically linked — one file, no system
# libraries on the consumer. `hook/build.dart` downloads the matching asset by
# `libnitro_server-<os>-<arch>.<ext>` and verifies the `.sha256` sidecar.
#
# Linux prebuilts are built on Ubuntu 22.04 (glibc 2.35) with libstdc++ linked
# in, and a gate below refuses one that would need newer glibc or the host's
# libstdc++: a consumer on Ubuntu 22.04+ / Debian 12+ can always load them.
# macOS prebuilts need macOS 14+ (the macos-14 builders), Windows x64 needs
# Windows 10+.
#
# Asset names MUST match hook/build.dart: <os> in {macos,linux,windows},
# <arch> in {arm64,x64} (Architecture.name), <ext> in {dylib,so,dll}.
#
# Consumers do not trust these assets by their sidecars: the hook verifies a
# download against prebuilt_checksums.json (package root), which ships inside the pub
# package. The `verify` job below fills it for the tag with
# `tool/update_prebuilt_lock.sh` (cosign-verified bundles) and then pulls
# every asset back through the hook's own verification path
# (`tool/verify_prebuilt_lock.dart`, strict Sigstore mode); the resulting lock
# is a workflow artifact. Commit it, THEN `dart pub publish`.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# A moved tag supersedes the run in flight for it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write      # create the release + upload assets
  id-token: write      # provenance attestation (Sigstore)
  attestations: write

jobs:
  # Nothing is published from a tag that does not pass the suites.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y clang llvm pkg-config libssl-dev libuv1-dev libbrotli-dev libnghttp2-dev
      - run: flutter pub get
      - run: dart analyze
      - run: cmake -S src -B build/lib -DCMAKE_BUILD_TYPE=Release -DNITRO_SERVER_BUILD_TESTS=ON -DNITRO_SERVER_HTTP2=ON -DNITRO_SERVER_WERROR=ON
      - run: cmake --build build/lib --parallel
      - run: ./build/lib/nitro_server_tests/nitro_server_engine_tests
      - run: dart test
      # The tag ships nothing a sanitizer or the fuzzers would reject.
      - run: >
          cmake -S src -B build/asan -DCMAKE_BUILD_TYPE=Debug
          -DNITRO_SERVER_BUILD_TESTS=ON -DNITRO_SERVER_HTTP2=ON -DNITRO_SERVER_SANITIZE=address
      - run: cmake --build build/asan --parallel --target nitro_server_engine_tests
      - run: ASAN_OPTIONS=detect_leaks=1:detect_container_overflow=0 ./build/asan/nitro_server_tests/nitro_server_engine_tests
      - run: sudo apt-get install -y libclang-rt-dev && CXX=clang++ bash tool/fuzz.sh 30

  prebuilt:
    needs: test
    strategy:
      fail-fast: false
      # `deps` selects how the four dependencies are provisioned as PIC static
      # archives: Homebrew ships PIC `.a` for the native arch, and apt
      # (linux-arm64) ships PIC `.a` too — but Ubuntu's x86-64 apt archives are
      # NOT -fPIC (can't link into a .so), Windows has no system libs, and the
      # Intel-macOS (macos-13) runner is scarce, so those three use vcpkg static
      # triplets (always built -fPIC). macos-x64 is therefore cross-compiled on
      # the always-available Apple-Silicon runner: triplet x64-osx makes the
      # vcpkg toolchain set CMAKE_OSX_ARCHITECTURES=x86_64. The engine's
      # pkg-config/CONFIG detection finds whichever, via PKG_CONFIG_PATH +
      # CMAKE_PREFIX_PATH (+ OPENSSL_ROOT_DIR) when vcpkg is used.
      matrix:
        include:
          - { os: macos-14,        tag: macos-arm64,  deps: brew, lib: libnitro_server.dylib, out: libnitro_server-macos-arm64.dylib }
          - { os: macos-14,        tag: macos-x64,    deps: vcpkg, triplet: x64-osx,              lib: libnitro_server.dylib, out: libnitro_server-macos-x64.dylib }
          - { os: ubuntu-22.04-arm, tag: linux-arm64, deps: apt,  lib: libnitro_server.so,    out: libnitro_server-linux-arm64.so }
          - { os: ubuntu-22.04,    tag: linux-x64,    deps: vcpkg, triplet: x64-linux,            lib: libnitro_server.so,  out: libnitro_server-linux-x64.so }
          - { os: windows-latest,  tag: windows-x64,  deps: vcpkg, triplet: x64-windows-static-md, lib: nitro_server.dll,    out: libnitro_server-windows-x64.dll }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - if: matrix.deps == 'brew'
        run: brew install cmake pkg-config openssl@3 libuv brotli nghttp2
      - if: matrix.deps == 'apt'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libssl-dev libuv1-dev libbrotli-dev libnghttp2-dev
      # vcpkg static: all four deps + pkgconf (so the engine's pkg-config lookups
      # for brotli/nghttp2 resolve on Windows too, where there is no system one).
      - if: matrix.deps == 'vcpkg'
        shell: bash
        run: vcpkg install libuv openssl brotli nghttp2 pkgconf --triplet ${{ matrix.triplet }}

      - name: Configure + build (all features, static deps)
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ matrix.deps }}" = "vcpkg" ]; then
            VCPKG_ROOT="${VCPKG_INSTALLATION_ROOT:-$VCPKG_ROOT}"
            INST="$VCPKG_ROOT/installed/${{ matrix.triplet }}"
            export PKG_CONFIG_PATH="$INST/lib/pkgconfig:$PKG_CONFIG_PATH"
            export PATH="$INST/tools/pkgconf:$VCPKG_ROOT/installed/${{ matrix.triplet }}/tools/pkgconf:$PATH"
            # Pin OpenSSL to the vcpkg prefix so FindOpenSSL uses it — critical
            # for the macos-x64 cross-build, where engine.cmake's Homebrew
            # fallback would otherwise grab the host's arm64 openssl@3.
            export OPENSSL_ROOT_DIR="$INST"
            EXTRA="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DCMAKE_PREFIX_PATH=$INST -DOPENSSL_ROOT_DIR=$INST"
            # The vcpkg toolchain doesn't propagate the target arch to our
            # project, so an x64-osx build defaults to the host (arm64) and
            # can't link the x86_64 deps. Force it for the macOS cross-build.
            if [ "${{ matrix.triplet }}" = "x64-osx" ]; then
              EXTRA="$EXTRA -DCMAKE_OSX_ARCHITECTURES=x86_64"
            fi
          fi
          # NATIVE_TUNE=OFF: prebuilts must run on any CPU of their arch, so no
          # -march=native (it would also break the x86_64-on-arm64 cross-build).
          cmake -S src -B build/rel -DCMAKE_BUILD_TYPE=Release \
            -DNITRO_SERVER_HTTP2=ON -DNITRO_SERVER_STATIC_DEPS=ON \
            -DNITRO_SERVER_NATIVE_TUNE=OFF $EXTRA
          cmake --build build/rel --config Release --parallel

      - name: Stage artifact + SHA-256 sidecar
        shell: bash
        run: |
          mkdir -p dist
          # Locate the built library (generator layout varies).
          SRC=$(find build/rel -name '${{ matrix.lib }}' -type f | head -1)
          test -n "$SRC" || { echo "library ${{ matrix.lib }} not found"; exit 1; }
          cp "$SRC" "dist/${{ matrix.out }}"
          # Portability gate (Linux): the prebuilt must load on glibc 2.35
          # hosts (Ubuntu 22.04, Debian 12) and must not need the host's
          # libstdc++ at all. A newer builder image would silently raise both.
          if [[ "${{ matrix.tag }}" == linux-* ]]; then
            syms=$(readelf --dyn-syms "dist/${{ matrix.out }}")
            maxglibc=$(echo "$syms" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -t_ -k2 -V | uniq | tail -1)
            echo "max glibc symbol version: $maxglibc"
            [ "$(printf '%s\n' "${maxglibc#GLIBC_}" 2.35 | sort -V | tail -1)" = "2.35" ] || { echo "prebuilt needs glibc > 2.35"; exit 1; }
            if echo "$syms" | grep -qE 'GLIBCXX_|CXXABI_'; then echo "prebuilt still needs the host libstdc++"; exit 1; fi
            readelf -d "dist/${{ matrix.out }}" | grep NEEDED
          fi
          cd dist
          if command -v shasum >/dev/null; then
            shasum -a 256 "${{ matrix.out }}" > "${{ matrix.out }}.sha256"
          else
            certutil -hashfile "${{ matrix.out }}" SHA256 | sed -n 2p | tr -d ' \r' > "${{ matrix.out }}.sha256"
          fi
          cat "${{ matrix.out }}.sha256"

      # Build provenance (SLSA-style, Sigstore-signed) for each prebuilt: a
      # consumer can verify the asset was built by this workflow from this
      # commit with `gh attestation verify <file> --repo <owner/repo>`.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/${{ matrix.out }}

      # Keyless Sigstore signature (OIDC identity of this workflow, no key to
      # manage or leak) as a self-contained bundle. Verify with:
      #   cosign verify-blob --bundle <asset>.sigstore.json \
      #     --certificate-identity-regexp 'github.com/<owner>/<repo>/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com <asset>
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the asset
        shell: bash
        run: cosign sign-blob --yes --bundle "dist/${{ matrix.out }}.sigstore.json" "dist/${{ matrix.out }}"

      # SPDX SBOM of the asset (what it was built from: the deps linked in).
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: dist/${{ matrix.out }}
          format: spdx-json
          output-file: dist/${{ matrix.out }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/${{ matrix.out }}
            dist/${{ matrix.out }}.sha256
            dist/${{ matrix.out }}.sigstore.json
            dist/${{ matrix.out }}.spdx.json

  # The consumer path, end to end, against the release just published: lock
  # the assets (sidecar cross-check + cosign bundle verification), then
  # download each one through lib/src/internal/prebuilt_lock.dart exactly as a consumer's
  # build hook would, in strict Sigstore mode. A tag whose assets a consumer
  # would refuse fails here. The lock is attached as an artifact to commit
  # before `dart pub publish`.
  verify:
    needs: prebuilt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - run: flutter pub get
      - name: Lock the release's assets (cosign-verified)
        run: tool/update_prebuilt_lock.sh "${GITHUB_REF_NAME#v}"
      - name: Pull every asset back through the hook's verification path
        env:
          NITRO_SERVER_VERIFY_SIGSTORE: '1'
        run: dart tool/verify_prebuilt_lock.dart "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prebuilt_checksums
          path: prebuilt_checksums.json
