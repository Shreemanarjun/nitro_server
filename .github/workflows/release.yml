# Builds the self-contained engine prebuilts and attaches them to the GitHub
# Release for a `v*` tag. Each is built with ALL features
# (`-DNITRO_SERVER_HTTP2=ON` + TLS + brotli) and `-DNITRO_SERVER_STATIC_DEPS=ON`
# so libuv/OpenSSL/brotli/nghttp2 are statically linked — one file, no system
# libraries on the consumer. `hook/build.dart` downloads the matching asset by
# `libnitro_server-<os>-<arch>.<ext>` and verifies the `.sha256` sidecar.
#
# Asset names MUST match hook/build.dart: <os> in {macos,linux,windows},
# <arch> in {arm64,x64} (Architecture.name), <ext> in {dylib,so,dll}.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # create the release + upload assets

jobs:
  prebuilt:
    strategy:
      fail-fast: false
      # `deps` selects how the four dependencies are provisioned as PIC static
      # archives: Homebrew ships PIC `.a` for the native arch, and apt
      # (linux-arm64) ships PIC `.a` too — but Ubuntu's x86-64 apt archives are
      # NOT -fPIC (can't link into a .so), Windows has no system libs, and the
      # Intel-macOS (macos-13) runner is scarce, so those three use vcpkg static
      # triplets (always built -fPIC). macos-x64 is therefore cross-compiled on
      # the always-available Apple-Silicon runner: triplet x64-osx makes the
      # vcpkg toolchain set CMAKE_OSX_ARCHITECTURES=x86_64. The engine's
      # pkg-config/CONFIG detection finds whichever, via PKG_CONFIG_PATH +
      # CMAKE_PREFIX_PATH (+ OPENSSL_ROOT_DIR) when vcpkg is used.
      matrix:
        include:
          - { os: macos-14,        tag: macos-arm64,  deps: brew, lib: libnitro_server.dylib, out: libnitro_server-macos-arm64.dylib }
          - { os: macos-14,        tag: macos-x64,    deps: vcpkg, triplet: x64-osx,              lib: libnitro_server.dylib, out: libnitro_server-macos-x64.dylib }
          - { os: ubuntu-24.04-arm, tag: linux-arm64, deps: apt,  lib: libnitro_server.so,    out: libnitro_server-linux-arm64.so }
          - { os: ubuntu-24.04,    tag: linux-x64,    deps: vcpkg, triplet: x64-linux,            lib: libnitro_server.so,  out: libnitro_server-linux-x64.so }
          - { os: windows-latest,  tag: windows-x64,  deps: vcpkg, triplet: x64-windows-static-md, lib: nitro_server.dll,    out: libnitro_server-windows-x64.dll }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - if: matrix.deps == 'brew'
        run: brew install cmake pkg-config openssl@3 libuv brotli nghttp2
      - if: matrix.deps == 'apt'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libssl-dev libuv1-dev libbrotli-dev libnghttp2-dev
      # vcpkg static: all four deps + pkgconf (so the engine's pkg-config lookups
      # for brotli/nghttp2 resolve on Windows too, where there is no system one).
      - if: matrix.deps == 'vcpkg'
        shell: bash
        run: vcpkg install libuv openssl brotli nghttp2 pkgconf --triplet ${{ matrix.triplet }}

      - name: Configure + build (all features, static deps)
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ matrix.deps }}" = "vcpkg" ]; then
            VCPKG_ROOT="${VCPKG_INSTALLATION_ROOT:-$VCPKG_ROOT}"
            INST="$VCPKG_ROOT/installed/${{ matrix.triplet }}"
            export PKG_CONFIG_PATH="$INST/lib/pkgconfig:$PKG_CONFIG_PATH"
            export PATH="$INST/tools/pkgconf:$VCPKG_ROOT/installed/${{ matrix.triplet }}/tools/pkgconf:$PATH"
            # Pin OpenSSL to the vcpkg prefix so FindOpenSSL uses it — critical
            # for the macos-x64 cross-build, where engine.cmake's Homebrew
            # fallback would otherwise grab the host's arm64 openssl@3.
            export OPENSSL_ROOT_DIR="$INST"
            EXTRA="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DCMAKE_PREFIX_PATH=$INST -DOPENSSL_ROOT_DIR=$INST"
          fi
          cmake -S src -B build/rel -DCMAKE_BUILD_TYPE=Release \
            -DNITRO_SERVER_HTTP2=ON -DNITRO_SERVER_STATIC_DEPS=ON $EXTRA
          cmake --build build/rel --config Release --parallel

      - name: Stage artifact + SHA-256 sidecar
        shell: bash
        run: |
          mkdir -p dist
          # Locate the built library (generator layout varies).
          SRC=$(find build/rel -name '${{ matrix.lib }}' -type f | head -1)
          test -n "$SRC" || { echo "library ${{ matrix.lib }} not found"; exit 1; }
          cp "$SRC" "dist/${{ matrix.out }}"
          cd dist
          if command -v shasum >/dev/null; then
            shasum -a 256 "${{ matrix.out }}" > "${{ matrix.out }}.sha256"
          else
            certutil -hashfile "${{ matrix.out }}" SHA256 | sed -n 2p | tr -d ' \r' > "${{ matrix.out }}.sha256"
          fi
          cat "${{ matrix.out }}.sha256"

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.out }}
            dist/${{ matrix.out }}.sha256
