plugins {
    id "com.android.library"
    // No Kotlin plugin: nitro_server has no JVM code. The Nitro spec declares
    // `AndroidNativeImpl.cpp`, so Android talks to the engine through
    // dart:ffi and never through JNI. Flutter's build infrastructure would
    // apply KGP automatically anyway — adding "org.jetbrains.kotlin.android"
    // here triggers a deprecation warning and will break in future Flutter
    // versions.
    // See: https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin
}

group = "dev.shreeman.nitro_server"
version = "1.0"

android {
    namespace = "dev.shreeman.nitro_server"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    externalNativeBuild {
        cmake { path = "../src/CMakeLists.txt" }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = "17" }

    buildTypes {
        // Flutter's profile variant: without an explicit profile buildType,
        // AGP builds the plugin's CMake code with the DEBUG config — the
        // whole native library ships at -O0 in profile mode. Inherit release
        // so profile builds measure optimized native code.
        profile {
            initWith release
        }
    }

    defaultConfig {
            consumerProguardFiles "consumer-rules.pro"
 minSdk = 24 }

    sourceSets {
        main {
            // Do NOT add to java.srcDirs — in AGP 8.x that routes .kt files
            // through the Java compiler and causes "Unresolved reference" errors.
            kotlin.srcDirs += "${project.projectDir}/../lib/src/generated/kotlin"
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
}
