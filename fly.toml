# Fly.io deploy (runs the Docker image). `fly launch --dockerfile Dockerfile`
# then `fly deploy`. Fly sends SIGINT/SIGTERM on stop/deploy, which
# shutdownOnSignals() drains gracefully.
app = "nitro-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    method = "get"
    path = "/readyz"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
