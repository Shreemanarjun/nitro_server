# Netlify hosts a STATIC frontend; nitro_server is a persistent native process,
# so it runs on a container host (Fly.io / Render / Cloud Run — see
# doc/deployment.md), NOT as a Netlify Function. This config serves your static
# site and proxies API + WebSocket calls to the deployed backend.
#
# Replace the backend host below with your deployed nitro_server URL.
[build]
  publish = "public"

# HTTP API -> nitro backend.
[[redirects]]
  from = "/api/*"
  to = "https://your-nitro-backend.fly.dev/:splat"
  status = 200
  force = true

# WebSocket upgrade -> nitro backend.
[[redirects]]
  from = "/ws"
  to = "wss://your-nitro-backend.fly.dev/ws"
  status = 200
  force = true
