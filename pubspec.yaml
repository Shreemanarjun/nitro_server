name: nitro_server
description: Fast HTTP/1.1 and WebSocket server for Dart and Flutter, backed by a native multithreaded C++ engine over Nitro FFI, with trie routing and per-route timeouts.
version: 1.0.0
homepage: https://github.com/Shreemanarjun/nitro_server
repository: https://github.com/Shreemanarjun/nitro_server
issue_tracker: https://github.com/Shreemanarjun/nitro_server/issues
topics:
  - http
  - server
  - network
  - ffi
  - nitro

environment:
  sdk: ^3.12.2
  # Required by pub to publish the flutter.plugin.platforms block below.
  # The Dart code stays Flutter-free (see the note above `flutter:`).
  flutter: '>=3.10.0'

dependencies:
  meta: ^1.9.0
  nitro: ^0.8.0

  hotreloader: any
  hooks: ^1.0.3
  code_assets: ^1.0.0
  crypto: ^3.0.7

# `dart run nitro_server:nitro <serve|build>` (or `nitro …` once globally
# activated) runs or compiles a server entrypoint — JIT+hot-reload or AOT.
executables:
  nitro: nitro

dev_dependencies:
  lints: ^6.1.0
  build_runner: ^2.4.0
  nitro_generator: ^0.8.0
  shelf: ^1.4.2
  test: ^1.25.0
  benchmark_harness: ^2.4.0

