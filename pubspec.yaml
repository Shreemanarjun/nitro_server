name: nitro_server
description: A fast HTTP server for Flutter backed by a native multithreaded C++ engine over Nitro FFI, with trie routing, per-route timeouts and TLS.
version: 0.0.1
homepage: https://github.com/Shreemanarjun/nitro_server
repository: https://github.com/Shreemanarjun/nitro_server
issue_tracker: https://github.com/Shreemanarjun/nitro_server/issues
topics:
  - http
  - server
  - network
  - ffi
  - nitro

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  nitro: ^0.7.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  nitro_generator: ^0.7.5
  test: ^1.25.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # nitro_server is an FFI-only plugin on all five platforms: the Nitro spec
  # declares AppleNativeImpl.cpp / AndroidNativeImpl.cpp / NativeImpl.cpp, so
  # there is no Swift, Kotlin or Objective-C class to register. `ffiPlugin`
  # alone tells the tooling to build and bundle the native code; declaring a
  # plugin class here would make Flutter emit a registrant call to a class
  # that does not exist.
  #
  # Web is intentionally unsupported: browsers cannot bind raw sockets.
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      linux:
        ffiPlugin: true
