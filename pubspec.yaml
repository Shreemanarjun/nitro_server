name: nitro_server
description: Fast HTTP/1.1 and WebSocket server for Dart and Flutter, backed by a native multithreaded C++ engine over Nitro FFI, with trie routing and per-route timeouts.
version: 0.0.1
homepage: https://github.com/Shreemanarjun/nitro_server
repository: https://github.com/Shreemanarjun/nitro_server
issue_tracker: https://github.com/Shreemanarjun/nitro_server/issues
topics:
  - http
  - server
  - network
  - ffi
  - nitro

environment:
  sdk: ^3.12.2
  # Required by pub to publish the flutter.plugin.platforms block below.
  # The Dart code stays Flutter-free (see the note above `flutter:`).
  flutter: '>=3.10.0'

dependencies:
  meta: ^1.9.0
  nitro: ^0.7.8

dev_dependencies:
  lints: ^6.1.0
  build_runner: ^2.4.0
  nitro_generator: ^0.7.8
  shelf: ^1.4.2
  test: ^1.25.0
  benchmark_harness: ^2.4.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
#
# The Dart code itself is Flutter-free (`dart pub get` / `dart test` /
# `dart run` all work — this package has no `flutter` SDK dependency), so
# Dart CLI programs can use it by building the native library with cmake and
# calling `loadNitroServerNative()` once at startup (see
# `lib/src/api/native_loader.dart`). The `ffiPlugin` block below is ignored
# by the Dart tool and exists so Flutter apps keep getting the native
# library built and bundled automatically.
flutter:
  # nitro_server is an FFI-only plugin on all five platforms: the Nitro spec
  # declares AppleNativeImpl.cpp / AndroidNativeImpl.cpp / NativeImpl.cpp, so
  # there is no Swift, Kotlin or Objective-C class to register. `ffiPlugin`
  # alone tells the tooling to build and bundle the native code; declaring a
  # plugin class here would make Flutter emit a registrant call to a class
  # that does not exist.
  #
  # Web is intentionally unsupported: browsers cannot bind raw sockets.
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      linux:
        ffiPlugin: true
